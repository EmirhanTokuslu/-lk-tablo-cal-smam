<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>Tablo Çalışması</title>
  <style>
    table {
      background-color: #a8c8ff;
      border: 2px solid #4a5a9a;
      border-spacing: 6px;  /* hüvreler arasında 6px boşluk bırakır */                              /* TR: tableden sonraki ana etiket*/
      font-size: 18px;                                                                             /* TD: veri girişi*/
                                                                                                   /* TH : başlık */
      
    }

    th, td {
      border: 2px solid #3a4a8a;
      padding: 6px;  /* yazıI ile hücre arasında 6px boşluk*/
    }

    th { background-color: #ffffc0; 
    text-align: center;}

    td { background-color: #ffffff; }

    .ortala{text-align: center;}


  </style>
</head>
<body>


  <table align="center">

    <tr>
      <th>Numarası</th>
      <th>Adı</th>
      <th>Soyadı</th>
    </tr>


    <tr>
      <td class="ortala">1</td>
      <td>Mustafa Kemal</td>
      <td>ATATÜRK</td>
    </tr>


    <tr>
      
      <td class="ortala">2</td>
      <td>Muhsin</td>
      <td>Yazıcıoğlu</td>
    
    </tr>


    <tr>

      <td class="ortala">3</td>
      <td>Alparslan</td>
      <td>Türkeş</td>
    
    </tr>


    <tr>
      
      <td class="ortala">4</td>
      <td>Abdullah</td>
      <td>Çatlı</td>
    
    </tr>

  </table>


</body>
</html>
